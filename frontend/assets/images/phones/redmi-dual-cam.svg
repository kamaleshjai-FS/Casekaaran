<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowRedmi" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F5F0E8" />
      <stop offset="100%" stop-color="#E5DEC9" />
    </radialGradient>
    <linearGradient id="redmiBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A7B" />
      <stop offset="100%" stop-color="#193347" />
    </linearGradient>
    <filter id="shadowRedmi" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#101B2D" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGlowRedmi)" rx="16" />

  <g filter="url(#shadowRedmi)">
    <!-- Phone Outer Body -->
    <rect x="110" y="50" width="180" height="300" rx="32" fill="url(#redmiBody)" stroke="#45789E" stroke-width="2" />

    <!-- Dual Camera Island (Signature Redmi / POCO Visor) -->
    <rect x="122" y="65" width="156" height="64" rx="14" fill="#0E1720" stroke="#253849" stroke-width="2" />

    <!-- Lens 1 (Primary High-res AI Cam) -->
    <circle cx="156" cy="97" r="20" fill="#141E28" stroke="#37526A" stroke-width="2" />
    <circle cx="156" cy="97" r="14" fill="#070A0E" />
    <circle cx="156" cy="97" r="7" fill="#000000" />
    <circle cx="153" cy="94" r="3" fill="#4B90E2" opacity="0.8" />

    <!-- Lens 2 (Secondary Depth/Macro) -->
    <circle cx="204" cy="97" r="20" fill="#141E28" stroke="#37526A" stroke-width="2" />
    <circle cx="204" cy="97" r="14" fill="#070A0E" />
    <circle cx="204" cy="97" r="7" fill="#000000" />
    <circle cx="201" cy="94" r="3" fill="#4B90E2" opacity="0.8" />

    <!-- LED Dual Tone Flash -->
    <rect x="240" y="87" width="14" height="20" rx="7" fill="#FFF4D0" stroke="#B8A76B" stroke-width="1" />

    <!-- AI Camera Label -->
    <text x="200" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" fill="#6992B2" letter-spacing="2">AI DUAL CAMERA • 50MP</text>

    <!-- Redmi / POCO Brand mark -->
    <text x="135" y="325" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" opacity="0.85" letter-spacing="3">Redmi</text>
  </g>
</svg>