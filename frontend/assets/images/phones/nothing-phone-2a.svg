<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F5F0E8" />
      <stop offset="100%" stop-color="#E5DEC9" />
    </radialGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22252B" />
      <stop offset="100%" stop-color="#14161A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#101B2D" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Plinth -->
  <rect width="400" height="400" fill="url(#bgGlow)" rx="16" />

  <!-- Shadow & Phone Silhouette -->
  <g filter="url(#shadow)">
    <!-- Phone Outer Body -->
    <rect x="110" y="50" width="180" height="300" rx="36" fill="url(#phoneBody)" stroke="#383D48" stroke-width="3" />
    
    <!-- Transparent Internal Glass Look -->
    <rect x="116" y="56" width="168" height="288" rx="30" fill="#181A20" opacity="0.95" />

    <!-- Ribbon Cable Aesthetics (Nothing Style) -->
    <path d="M 140 180 Q 200 170 200 240 T 260 250" fill="none" stroke="#2C313C" stroke-width="12" stroke-linecap="round" />
    <path d="M 140 200 L 260 200" fill="none" stroke="#252932" stroke-width="4" stroke-dasharray="6,4" />

    <!-- Circular Glyph Area -->
    <circle cx="200" cy="130" r="44" fill="#1C1F26" stroke="#2D333F" stroke-width="2" />

    <!-- White Glyph Light Strips -->
    <path d="M 166 100 A 42 42 0 0 1 234 100" fill="none" stroke="#F0F3F6" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <path d="M 238 120 A 42 42 0 0 1 228 160" fill="none" stroke="#F0F3F6" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <path d="M 162 120 A 42 42 0 0 0 172 160" fill="none" stroke="#F0F3F6" stroke-width="4" stroke-linecap="round" opacity="0.9" />

    <!-- Dual Camera Pill (The "Eyes" of Phone 2a) -->
    <rect x="170" y="116" width="60" height="28" rx="14" fill="#0A0B0D" stroke="#4B5363" stroke-width="2" />
    <!-- Camera Lens 1 -->
    <circle cx="184" cy="130" r="9" fill="#15171C" stroke="#2E3440" stroke-width="1.5" />
    <circle cx="184" cy="130" r="5" fill="#050608" />
    <circle cx="182" cy="128" r="2" fill="#4B90E2" opacity="0.8" />
    
    <!-- Camera Lens 2 -->
    <circle cx="216" cy="130" r="9" fill="#15171C" stroke="#2E3440" stroke-width="1.5" />
    <circle cx="216" cy="130" r="5" fill="#050608" />
    <circle cx="214" cy="128" r="2" fill="#4B90E2" opacity="0.8" />

    <!-- LED Flash -->
    <circle cx="250" cy="100" r="4" fill="#FFF2BD" stroke="#B8A76B" stroke-width="1" />

    <!-- Subtle Red Recording LED Point -->
    <circle cx="248" cy="80" r="2" fill="#E02424" />

    <!-- Brand Typography Minimal Tag -->
    <text x="200" y="324" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#6B7280" letter-spacing="3">NOTHING (2a)</text>
  </g>
</svg>