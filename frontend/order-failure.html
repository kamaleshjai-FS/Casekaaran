<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Payment Incomplete — Casekaaran</title>
  <link rel="icon" href="assets/icons/casekaaran-logo.jpeg" type="image/jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/storefront.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar-custom">
    <div class="container-custom d-flex align-items-center justify-content-between">
      <a href="index.html" class="brand-logo text-decoration-none">
        <img src="assets/icons/casekaaran-logo.jpeg" alt="Casekaaran Logo" class="brand-logo-img" />
        <span>Casekaaran</span><span class="brand-dot"></span>
        <span class="brand-tagline d-none d-sm-inline">Cases Only</span>
      </a>

      <div class="lang-selector-group">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="hi">हिन्दी</button>
      </div>
    </div>
  </header>

  <main class="py-5">
    <div class="container-custom" style="max-width: 600px;">
      <div class="text-center mb-5">
        <div class="d-inline-flex align-items-center justify-content-center bg-danger text-white rounded-circle mb-3 shadow-sm" style="width: 68px; height: 68px; font-size: 1.85rem;">
          <i class="bi bi-x-lg"></i>
        </div>
        <span class="section-eyebrow text-danger">Transaction Status</span>
        <h1 class="fw-bold mb-2 font-display fs-2" data-i18n="orderFailure.title">Payment Incomplete</h1>
        <p class="text-muted" style="font-size: 0.9375rem;" data-i18n="orderFailure.message">
          Your payment attempt was cancelled or declined by your financial institution. Your chosen case model and cart items remain saved.
        </p>

        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 mt-4">
          <a href="checkout.html" class="btn-ck btn-ck-primary btn-ck-lg" data-i18n="orderFailure.retryBtn">
            <i class="bi bi-arrow-repeat"></i> Retry Payment
          </a>
          <a href="https://wa.me/919876543210" target="_blank" class="btn-ck btn-ck-secondary btn-ck-lg">
            <i class="bi bi-whatsapp text-success"></i> WhatsApp Support
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-custom mt-auto">
    <div class="container-custom text-center text-muted" style="font-size: 0.8125rem;">
      &copy; 2026 Casekaaran. All rights reserved.
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/hi.js"></script>
  <script src="js/language.js"></script>
</body>
</html>
