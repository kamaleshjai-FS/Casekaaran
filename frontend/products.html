<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>All Mobile Phone Cases — Casekaaran</title>
  <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/storefront.css">
</head>
<body>

  <!-- Top Announcement Bar -->
  <aside class="announcement-bar">
    <div class="container-custom d-flex align-items-center justify-content-center">
      <span data-i18n="announcement.message">⚡ Festive Special: Flat 20% OFF on all MagSafe & Armor Cases | Free Delivery Nationwide</span>
    </div>
  </aside>

  <!-- Navbar -->
  <header class="navbar-custom">
    <div class="container-custom d-flex align-items-center justify-content-between">
      <a href="index.html" class="brand-logo text-decoration-none">
        <i class="bi bi-shield-shaded text-primary"></i>
        <span>Casekaaran</span>
      </a>

      <div class="nav-actions">
        <div class="lang-selector-group">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="hi">हिन्दी</button>
        </div>
        <a href="cart.html" class="nav-icon-btn">
          <i class="bi bi-bag" style="font-size: 1.25rem;"></i>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="py-5">
    <div class="container-custom">
      <!-- Breadcrumb & Title -->
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <div>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-1" style="font-size: 0.8125rem;">
              <li class="breadcrumb-item"><a href="index.html">Home</a></li>
              <li class="breadcrumb-item active" aria-current="page">Catalog</li>
            </ol>
          </nav>
          <h2 class="fw-bold mb-0" id="catalog-heading" data-i18n="sections.allCases">All Compatible Cases</h2>
        </div>

        <!-- Sort Select -->
        <div class="d-flex align-items-center gap-2">
          <label class="text-muted text-nowrap" style="font-size: 0.875rem;" data-i18n="product.sortBy">Sort By:</label>
          <select id="catalog-sort" class="form-select form-select-sm" style="width: auto;">
            <option value="newest" data-i18n="product.sortNewest">Newest</option>
            <option value="price_asc" data-i18n="product.sortPriceLowHigh">Price: Low to High</option>
            <option value="price_desc" data-i18n="product.sortPriceHighLow">Price: High to Low</option>
          </select>
        </div>
      </div>

      <div class="row g-4">
        <!-- Sidebar Filters -->
        <aside class="col-lg-3">
          <div class="p-4 bg-white border rounded-3 mb-4">
            <h5 class="fw-bold mb-3" style="font-size: 1rem;">Filters</h5>

            <!-- Brand Filter -->
            <div class="mb-4">
              <label class="form-label-custom" data-i18n="product.filterBrand">Brand</label>
              <select id="filter-brand-select" class="form-select form-control-custom">
                <option value="">All Brands</option>
                <option value="apple">Apple</option>
                <option value="samsung">Samsung</option>
                <option value="oneplus">OnePlus</option>
                <option value="google-pixel">Google Pixel</option>
                <option value="xiaomi">Xiaomi</option>
                <option value="motorola">Motorola</option>
              </select>
            </div>

            <!-- Case Type Filter -->
            <div class="mb-4">
              <label class="form-label-custom" data-i18n="product.filterCaseType">Case Type</label>
              <div class="form-check mb-2">
                <input class="form-check-input filter-casetype" type="checkbox" value="magsafe" id="ct-magsafe">
                <label class="form-check-label" for="ct-magsafe">MagSafe Matte</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input filter-casetype" type="checkbox" value="rugged" id="ct-rugged">
                <label class="form-check-label" for="ct-rugged">Military Rugged</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input filter-casetype" type="checkbox" value="silicone" id="ct-silicone">
                <label class="form-check-label" for="ct-silicone">Liquid Silicone</label>
              </div>
              <div class="form-check">
                <input class="form-check-input filter-casetype" type="checkbox" value="leather" id="ct-leather">
                <label class="form-check-label" for="ct-leather">Vegan Leather</label>
              </div>
            </div>

            <button class="btn-ck btn-ck-secondary btn-block btn-ck-sm" onclick="resetFilters()">Reset Filters</button>
          </div>
        </aside>

        <!-- Product Grid -->
        <div class="col-lg-9">
          <div class="product-grid" id="product-grid-container">
            <!-- Rendered by ProductCatalog -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-custom mt-auto">
    <div class="container-custom text-center text-muted" style="font-size: 0.8125rem;">
      &copy; 2026 Casekaaran. All rights reserved. <a href="admin-login.html" class="text-muted ms-2">Admin</a>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/hi.js"></script>
  <script src="js/language.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ProductCatalog.init();

      const brandSelect = document.getElementById('filter-brand-select');
      const sortSelect = document.getElementById('catalog-sort');

      if (brandSelect) {
        brandSelect.addEventListener('change', () => {
          ProductCatalog.loadProducts({ brand: brandSelect.value, sort: sortSelect.value });
        });
      }

      if (sortSelect) {
        sortSelect.addEventListener('change', () => {
          ProductCatalog.loadProducts({ brand: brandSelect ? brandSelect.value : '', sort: sortSelect.value });
        });
      }
    });

    function resetFilters() {
      document.getElementById('filter-brand-select').value = '';
      document.querySelectorAll('.filter-casetype').forEach(cb => cb.checked = false);
      ProductCatalog.loadProducts();
    }
  </script>
</body>
</html>
