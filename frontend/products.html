<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>All Mobile Phone Cases — Casekaaran</title>
  <link rel="icon" href="assets/icons/casekaaran-logo.jpeg" type="image/jpeg">

  <!-- Google Fonts: Manrope, Inter, Noto Sans Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/storefront.css">
</head>
<body>

  <!-- Top Announcement Bar -->
  <aside class="announcement-bar">
    <div class="container-custom d-flex align-items-center justify-content-center">
      <span data-i18n="announcement.message">⚡ Festive Special: Flat 20% OFF on all MagSafe & Armor Cases | Free Delivery Nationwide</span>
    </div>
  </aside>

  <!-- Navbar -->
  <header class="navbar-custom">
    <div class="container-custom d-flex align-items-center justify-content-between">
      <a href="index.html" class="brand-logo text-decoration-none">
        <img src="assets/icons/casekaaran-logo.jpeg" alt="Casekaaran Logo" class="brand-logo-img" />
        <span>Casekaaran</span><span class="brand-dot"></span>
      </a>

      <!-- Desktop Nav Search -->
      <div class="d-none d-lg-block" style="width: 380px;">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
          <input type="text" class="form-control border-start-0 global-search-input" data-i18n-placeholder="nav.searchPlaceholder" placeholder="Search phone model..." />
        </div>
      </div>

      <div class="nav-actions">
        <div class="lang-selector-group">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="hi">हिन्दी</button>
        </div>
        <a href="cart.html" class="nav-icon-btn" aria-label="Shopping Cart">
          <i class="bi bi-bag" style="font-size: 1.25rem;"></i>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="py-5">
    <div class="container-custom">
      <!-- Breadcrumb & Title Area -->
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3 pb-3 border-bottom">
        <div>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-1" style="font-size: 0.8125rem;">
              <li class="breadcrumb-item"><a href="index.html">Home</a></li>
              <li class="breadcrumb-item active" aria-current="page">Catalog</li>
            </ol>
          </nav>
          <h1 class="fw-bold mb-0 font-display fs-2" id="catalog-heading" data-i18n="sections.allCases">All Compatible Cases</h1>
        </div>

        <!-- Sort Select & Mobile Filter Toggle -->
        <div class="d-flex align-items-center gap-3">
          <!-- Mobile Filter Button Trigger -->
          <button class="btn-ck btn-ck-secondary btn-ck-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#filterDrawer">
            <i class="bi bi-funnel"></i> Filters
          </button>

          <div class="d-flex align-items-center gap-2">
            <label class="text-muted text-nowrap" style="font-size: 0.8125rem;" data-i18n="product.sortBy">Sort By:</label>
            <select id="catalog-sort" class="form-select form-select-sm" style="width: auto; border-radius: var(--radius-full); font-size: 0.8125rem;">
              <option value="newest" data-i18n="product.sortNewest">Newest Arrivals</option>
              <option value="price_asc" data-i18n="product.sortPriceLowHigh">Price: Low to High</option>
              <option value="price_desc" data-i18n="product.sortPriceHighLow">Price: High to Low</option>
              <option value="popular">Most Popular</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <!-- Desktop Sidebar Filters -->
        <aside class="col-lg-3 d-none d-lg-block">
          <div class="p-4 bg-white border rounded-4 mb-4 shadow-sm position-sticky" style="top: calc(var(--navbar-height) + 20px);">
            <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
              <h6 class="fw-bold mb-0 font-display" style="text-transform: uppercase; letter-spacing: 0.05em;">Filters</h6>
              <button class="btn btn-link p-0 text-muted" style="font-size: 0.75rem;" onclick="resetFilters()">Reset All</button>
            </div>

            <!-- Brand Filter -->
            <div class="mb-4">
              <label class="form-label-custom" data-i18n="product.filterBrand">Smartphone Brand</label>
              <select id="filter-brand-select" class="form-select form-control-custom">
                <option value="">All Brands</option>
                <option value="apple">Apple</option>
                <option value="samsung">Samsung</option>
                <option value="oneplus">OnePlus</option>
                <option value="google-pixel">Google Pixel</option>
                <option value="xiaomi">Xiaomi</option>
                <option value="motorola">Motorola</option>
              </select>
            </div>

            <!-- Case Type Filter -->
            <div class="mb-4">
              <label class="form-label-custom" data-i18n="product.filterCaseType">Case Material & Type</label>
              <div class="form-check mb-2">
                <input class="form-check-input filter-casetype" type="checkbox" value="magsafe" id="ct-magsafe">
                <label class="form-check-label" for="ct-magsafe" style="font-size: 0.875rem;">MagSafe Matte</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input filter-casetype" type="checkbox" value="rugged" id="ct-rugged">
                <label class="form-check-label" for="ct-rugged" style="font-size: 0.875rem;">Military Rugged</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input filter-casetype" type="checkbox" value="silicone" id="ct-silicone">
                <label class="form-check-label" for="ct-silicone" style="font-size: 0.875rem;">Liquid Silicone</label>
              </div>
              <div class="form-check">
                <input class="form-check-input filter-casetype" type="checkbox" value="leather" id="ct-leather">
                <label class="form-check-label" for="ct-leather" style="font-size: 0.875rem;">Vegan Leather</label>
              </div>
            </div>

            <button class="btn-ck btn-ck-primary btn-block btn-ck-sm" onclick="applyCurrentFilters()">
              Apply Filters
            </button>
          </div>
        </aside>

        <!-- Product Grid -->
        <div class="col-lg-9">
          <div class="product-grid" id="product-grid-container">
            <!-- Skeleton loaders while fetching -->
            <div class="col"><div class="skeleton-box" style="height: 380px;"></div></div>
            <div class="col"><div class="skeleton-box" style="height: 380px;"></div></div>
            <div class="col"><div class="skeleton-box" style="height: 380px;"></div></div>
            <div class="col"><div class="skeleton-box" style="height: 380px;"></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Mobile Offcanvas Filter Drawer (Bootstrap 5) -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="filterDrawer" aria-labelledby="filterDrawerLabel">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title fw-bold font-display" id="filterDrawerLabel">Filters</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div class="mb-4">
        <label class="form-label-custom">Smartphone Brand</label>
        <select id="filter-brand-mobile" class="form-select form-control-custom">
          <option value="">All Brands</option>
          <option value="apple">Apple</option>
          <option value="samsung">Samsung</option>
          <option value="oneplus">OnePlus</option>
          <option value="google-pixel">Google Pixel</option>
          <option value="xiaomi">Xiaomi</option>
          <option value="motorola">Motorola</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label-custom">Case Type</label>
        <div class="d-flex flex-column gap-2">
          <label class="form-check"><input type="checkbox" class="form-check-input filter-casetype-mobile" value="magsafe"> MagSafe Matte</label>
          <label class="form-check"><input type="checkbox" class="form-check-input filter-casetype-mobile" value="rugged"> Military Rugged</label>
          <label class="form-check"><input type="checkbox" class="form-check-input filter-casetype-mobile" value="silicone"> Liquid Silicone</label>
          <label class="form-check"><input type="checkbox" class="form-check-input filter-casetype-mobile" value="leather"> Vegan Leather</label>
        </div>
      </div>

      <button class="btn-ck btn-ck-primary btn-block mb-2" data-bs-dismiss="offcanvas" onclick="applyMobileFilters()">Apply Filters</button>
      <button class="btn-ck btn-ck-secondary btn-block btn-ck-sm" onclick="resetFilters()">Reset</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-custom mt-auto">
    <div class="container-custom text-center text-muted" style="font-size: 0.8125rem;">
      &copy; 2026 Casekaaran. All rights reserved. <a href="admin-login.html" class="text-muted ms-2">Admin Portal</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/hi.js"></script>
  <script src="js/language.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ProductCatalog.init();

      const sortSelect = document.getElementById('catalog-sort');
      if (sortSelect) {
        sortSelect.addEventListener('change', () => {
          applyCurrentFilters();
        });
      }
    });

    function applyCurrentFilters() {
      const brand = document.getElementById('filter-brand-select')?.value;
      const sort = document.getElementById('catalog-sort')?.value;
      ProductCatalog.loadProducts({ brand, sort });
    }

    function applyMobileFilters() {
      const brand = document.getElementById('filter-brand-mobile')?.value;
      const sort = document.getElementById('catalog-sort')?.value;
      ProductCatalog.loadProducts({ brand, sort });
    }

    function resetFilters() {
      const brandSelect = document.getElementById('filter-brand-select');
      const mobileBrand = document.getElementById('filter-brand-mobile');
      if (brandSelect) brandSelect.value = '';
      if (mobileBrand) mobileBrand.value = '';
      document.querySelectorAll('.filter-casetype, .filter-casetype-mobile').forEach(cb => cb.checked = false);
      ProductCatalog.loadProducts();
    }
  </script>
</body>
</html>
