<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Admin Portal Sign In — Casekaaran</title>
  <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body style="background-color: #0F172A; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">

  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5" style="width: 100%; max-width: 440px; background: #FFFFFF;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h3 class="fw-bold mb-1" style="color: #0F172A;">Casekaaran Admin</h3>
      <p class="text-muted" style="font-size: 0.875rem;">Authorized Administrator Access Only</p>
    </div>

    <form id="admin-login-form">
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size: 0.875rem;">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
          <input type="text" id="admin-user" class="form-control" placeholder="admin" required autofocus />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold" style="font-size: 0.875rem;">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
          <input type="password" id="admin-pass" class="form-control" placeholder="••••••••" required />
        </div>
      </div>

      <button type="submit" class="btn-ck btn-ck-primary btn-block btn-ck-lg mb-3" id="admin-signin-btn">
        <i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard
      </button>

      <div class="text-center">
        <a href="index.html" class="text-muted text-decoration-none" style="font-size: 0.8125rem;">
          <i class="bi bi-arrow-left"></i> Return to Public Storefront
        </a>
      </div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/language.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('admin-user').value.trim();
      const p = document.getElementById('admin-pass').value;
      const btn = document.getElementById('admin-signin-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...`;

      await Auth.login(u, p);
      btn.disabled = false;
      btn.innerHTML = `<i class="bi bi-box-arrow-in-right"></i> Sign In to Dashboard`;
    });
  </script>
</body>
</html>
